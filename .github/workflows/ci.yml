name: 品質チェック

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ivrooom.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/ivrm-help' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.jsを設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: 依存関係をインストール
        run: npm install

      - name: 公開情報と内部リンクを検証
        run: npm run check:repository

      - name: Astroの型・コンテンツを検証
        run: npm run check

      - name: GitHub Pages向け本番ビルドを検証
        run: npm run build
