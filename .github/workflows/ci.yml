name: 品質チェック

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ivrooom.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/ivrm-help' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.jsを設定
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm install

      - name: Astroの型・コンテンツを検証
        run: npm run check

      - name: GitHub Pages向け本番ビルドを検証
        run: npm run build
