name: 品質チェック

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm install

      - name: Astroの型・コンテンツを検証
        run: npm run check

      - name: 本番ビルドを検証
        run: npm run build
