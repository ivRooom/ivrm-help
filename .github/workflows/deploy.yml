name: GitHub Pagesへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ivrooom.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/ivrm-help' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: 依存関係をインストール
        run: npm install

      - name: Astroをビルド
        run: npm run build

      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
